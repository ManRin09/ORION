<header
  class="fixed top-0 inset-x-0 z-40 h-[58px] bg-[#0d101f]/95 backdrop-blur-sm border-b border-[#25293e] shadow-[0_6px_22px_rgba(0,0,0,0.58),0_2px_0_0_#05060d] px-3.5 sm:px-5 flex items-center justify-between gap-3"
>
  <!-- Left: Hamburger Toggle + Orion Brand Logo -->
  <div class="flex items-center gap-3 min-w-0">
    <button
      type="button"
      (click)="menuToggled.emit()"
      aria-label="Toggle navigation menu"
      class="w-9 h-9 bg-[#141729] border border-[#343952] hover:border-[#63de86] text-[#cfd4e8] hover:text-white flex items-center justify-center cursor-pointer transition-colors shrink-0"
    >
      <app-pixel-icon name="menu" [size]="16" />
    </button>

    <a
      routerLink="/home"
      class="inline-flex items-center gap-2.5 group min-w-0"
      aria-label="Orion Quests Home"
    >
      <img
        src="Favicom2.png"
        alt="Orion crest"
        class="w-8 h-8 object-contain shrink-0 [image-rendering:pixelated]"
      />
      <span
        class="font-display text-[14px] sm:text-[16px] tracking-[0.14em] text-[#45d97c] group-hover:text-[#63de86] transition-colors truncate"
      >
        ORION
      </span>
    </a>
  </div>

  <!-- Right: Real User Stats Pill (Streak + Gems) + Profile Card -->
  <div class="flex items-center gap-3 shrink-0">
    <div
      class="hidden sm:inline-flex items-center gap-3 bg-[#0a0c18] border border-[#2b3048] shadow-[2px_2px_0_0_#000000] px-3.5 py-1.5 font-pixel text-[11px] tracking-[0.06em]"
      aria-label="Adventurer streak and gems"
    >
      <span class="inline-flex items-center gap-1.5 text-[#f3c46b]">
        <app-pixel-icon name="flame" [size]="14" />
        <span>{{ streakText() }}</span>
      </span>
      <span class="text-[#3a3f58]" aria-hidden="true">|</span>
      <span class="inline-flex items-center gap-1.5 text-[#8ec5ff]">
        <app-pixel-icon name="diamond" [size]="14" />
        <span>{{ gemsCount() }} GEMS</span>
      </span>
    </div>

    <button
      type="button"
      (click)="profileSelected.emit()"
      class="inline-flex items-center gap-3 bg-[#141729] border border-[#343952] hover:border-[#63de86] shadow-[2px_2px_0_0_#000000] px-3 py-1 cursor-pointer transition-colors"
      aria-label="Open adventurer profile"
    >
      <div class="text-right leading-tight">
        <span class="block font-pixel text-[10px] tracking-[0.08em] text-[#f3c46b]">
          LVL {{ formattedLevel() }}
        </span>
        <span class="block font-pixel text-[11px] text-white max-w-[150px] truncate">
          {{ displayHandle() }}
        </span>
      </div>

      @if (user()?.avatarUrl; as avatar) {
        <img
          [src]="avatar"
          [alt]="displayHandle()"
          class="w-8 h-8 rounded-full border-2 border-[#44d67c] object-cover shrink-0"
        />
      } @else {
        <span
          class="w-8 h-8 rounded-full bg-[#44d67c] border-2 border-[#0a0c18] flex items-center justify-center text-[#071a10] shrink-0"
        >
          <app-pixel-icon name="user" [size]="15" />
        </span>
      }
    </button>
  </div>
</header>
