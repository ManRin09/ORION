<section
  id="save-progress"
  aria-labelledby="save-progress-heading"
  class="bg-[#101222] border-b border-[#3e4a3e]"
>
  <div class="max-w-[1280px] mx-auto px-5 sm:px-8 lg:px-10 py-14 lg:py-16">
    <div
      class="save-point-frame max-w-[1000px] mx-auto px-6 sm:px-12 py-14 sm:py-16 text-center"
    >
      <!-- Save Crystal Icon -->
      <div
        class="w-14 h-14 mx-auto mb-7 bg-[#101222] border-[3px] border-[#f0bf69] pixel-shadow flex items-center justify-center"
      >
        <app-pixel-icon name="diamond" [size]="30" />
      </div>

      <!-- Save Point Pill -->
      <div
        class="inline-flex items-center gap-2 bg-[#181a2a] border border-[#3e4a3e] px-3.5 py-1.5 mb-7"
      >
        <span class="text-[#f0bf69] text-[9px] leading-none" aria-hidden="true">▸</span>
        <span class="font-code text-[10px] sm:text-[11px] tracking-[0.08em] text-[#f0bf69]">
          NEW ADVENTURER SAVE POINT DETECTED
        </span>
      </div>

      <!-- Display Headline -->
      <h2
        id="save-progress-heading"
        class="font-display text-[24px] sm:text-[34px] lg:text-[40px] leading-[1.35] tracking-[0.02em] text-[#e1e1f7] mb-7"
      >
        <span class="block">SAVE PROGRESS.</span>
        <span class="block mt-1">START DAY 1</span>
        <span class="block mt-1">FREE.</span>
      </h2>

      <!-- Subtitle -->
      <p
        class="text-[13.5px] sm:text-[15px] leading-[1.75] text-[#bdcabb] max-w-[540px] mx-auto mb-10"
      >
        No credit card required. Free forever for core guild foundations. Runs directly in your
        browser without installs.
      </p>

      <!-- Wide Primary Retro CTA Button -->
      <div class="flex justify-center">
        <app-retro-button
          variant="primary"
          size="lg"
          routerLink="/register"
          class="w-full sm:w-[540px]"
          [fullWidth]="true"
        >
          [ CREATE CHARACTER &amp; START QUEST ]
        </app-retro-button>
      </div>
    </div>
  </div>
</section>
