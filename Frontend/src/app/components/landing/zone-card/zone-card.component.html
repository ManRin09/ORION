<article
  class="h-full bg-[#1c1e2f] border-4 pixel-shadow-lg flex flex-col transition-transform duration-150 hover:-translate-y-0.5"
  [class]="cardBorderClass()"
>
  <!-- Zone Top Bar -->
  <div
    class="bg-[#272939]/55 border-b border-[#3e4a3e] px-5 py-3.5 flex items-center justify-between gap-2"
  >
    <span class="font-pixel text-[12px] tracking-[0.06em]" [class]="zoneCodeClass()">
      {{ zone().zoneCode }}
    </span>
    <span
      class="font-pixel font-bold text-[10px] tracking-[0.05em] px-2.5 py-1 whitespace-nowrap"
      [class]="badgeClass()"
    >
      {{ zone().badgeLabel }}
    </span>
  </div>

  <!-- Zone Body -->
  <div class="p-6 flex-1 flex flex-col">
    <!-- Realm Icon Badge -->
    <div
      class="w-12 h-12 bg-[#101222] border-2 flex items-center justify-center mb-5"
      [class]="iconFrameClass()"
    >
      <app-pixel-icon [name]="zone().icon" [size]="24" />
    </div>

    <!-- Realm Title -->
    <h3
      class="font-display text-[16px] sm:text-[18px] leading-[1.45] tracking-[0.02em] text-[#e1e1f7] mb-4"
    >
      {{ zone().title }}
    </h3>

    <!-- Realm Description -->
    <p class="text-[12.5px] leading-[1.7] text-[#bdcabb] mb-6">
      {{ zone().description }}
    </p>

    <!-- Quest Checklist or Subclass Loadout -->
    <ul class="space-y-3 mb-7 flex-1">
      @for (objective of zone().objectives; track objective.id) {
        <li
          class="flex items-center gap-2.5 text-[12px] leading-snug"
          [class]="objectiveToneClass(objective.status)"
        >
          <app-pixel-icon [name]="objective.icon" [size]="15" />
          <span>{{ objective.label }}</span>
        </li>
      }
    </ul>

    <!-- Loot & Shrines Footer -->
    <div
      class="pt-5 border-t border-[#2f3142] flex items-center justify-between gap-3 font-pixel text-[11px] tracking-[0.04em]"
    >
      <span [class]="lootClass()">{{ zone().lootLabel }}</span>
      <span class="text-right" [class]="progressClass()">{{ zone().progressLabel }}</span>
    </div>
  </div>
</article>
